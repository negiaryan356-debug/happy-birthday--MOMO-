<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Happy birthday</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Newsreader:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
  :root{--red:#d6122b;--ink:#12103a;--lemon:#ffe45c;--pink:#ff9ec4;--mint:#7cffc4;--white:#fff;
    --display:"Bricolage Grotesque",system-ui,sans-serif;--body:"Newsreader",Georgia,serif}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden}
  body{background:radial-gradient(circle at 50% 30%,#ff4256,var(--red) 55%,#9c0a1d);color:var(--white);
    font-family:var(--body);font-size:1.25rem;line-height:1.6}
  h1,h2,h3{font-family:var(--display);margin:0;line-height:1}
  button{font-family:var(--display);font-weight:800;font-size:1.15rem;border:0;border-radius:999px;
    padding:1rem 2.2rem;background:var(--lemon);color:var(--ink);cursor:pointer}
  button:focus-visible{outline:3px solid var(--white);outline-offset:3px}
  .small{font-size:1rem;padding:.7rem 1.4rem}
  .ghost{background:rgba(255,255,255,.18);color:var(--white)}

  /* Pages turn in 3D, one at a time */
  .stage{position:fixed;inset:0;perspective:1100px}
  .page{position:absolute;inset:0;overflow-y:auto;padding:2.5rem 1.5rem 7rem;opacity:0;visibility:hidden;
    transition:transform .85s cubic-bezier(.2,.8,.2,1),opacity .6s,visibility 0s .85s}
  .page.active{opacity:1;visibility:visible;transform:none;transition:transform .85s cubic-bezier(.2,.8,.2,1) .1s,opacity .6s .1s,visibility 0s}
  .page.future{transform:translateX(45%) translateZ(-350px) rotateY(65deg)}
  .page.past{transform:translateX(-45%) translateZ(-350px) rotateY(-65deg)}
  .wrap{max-width:36rem;margin:0 auto}
  .center{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.5rem;text-align:center}
  h1{font-size:clamp(2.2rem,9vw,3.6rem);font-weight:800;max-width:14ch}
  h3{font-size:2rem;font-weight:800;margin-bottom:1.5rem}
  .hb{font-size:clamp(2.6rem,11vw,4.6rem);font-weight:800;color:var(--lemon)}
  .hint{margin:0;opacity:.8;font-style:italic}

  /* 3D gift cube */
  .scene{background:none;border:0;padding:0;border-radius:0;width:150px;height:150px;perspective:700px}
  .cube{--h:75px;width:150px;height:150px;position:relative;transform-style:preserve-3d;animation:spin 8s linear infinite}
  @keyframes spin{from{transform:rotateX(-22deg) rotateY(0)}to{transform:rotateX(-22deg) rotateY(360deg)}}
  .face{position:absolute;inset:0;border-radius:6px;display:block;opacity:1;
    background:linear-gradient(var(--lemon),var(--lemon)) center/100% 24px no-repeat,
               linear-gradient(var(--lemon),var(--lemon)) center/24px 100% no-repeat,var(--pink);
    transition:transform 1s cubic-bezier(.5,0,.2,1),opacity 1s}
  .f1{transform:translateZ(var(--h))}
  .f2{transform:rotateY(180deg) translateZ(var(--h))}
  .f3{transform:rotateY(90deg) translateZ(var(--h))}
  .f4{transform:rotateY(-90deg) translateZ(var(--h))}
  .f5{transform:rotateX(90deg) translateZ(var(--h))}
  .f6{transform:rotateX(-90deg) translateZ(var(--h))}
  .cube.open{--h:520px}
  .cube.open .face{opacity:0}

  /* Staggered 3D flip-ins */
  .page.active .msg p,.page.active .reasons li{animation:flipIn .75s both;animation-delay:calc(.5s + var(--i) * .2s)}
  @keyframes flipIn{from{opacity:0;transform:perspective(600px) rotateX(-85deg);transform-origin:top}to{opacity:1;transform:none}}
  .msg p{margin:1.4rem 0 0}
  .reasons{list-style:none;margin:0;padding:0;display:grid;gap:1rem}
  .reasons li{background:rgba(255,255,255,.14);border-left:5px solid var(--pink);border-radius:12px;padding:.9rem 1.1rem;line-height:1.45}

  /* 3D photo ring */
  .ring-wrap{perspective:1000px;height:360px;display:flex;align-items:center;justify-content:center;margin:1rem 0}
  .ring{width:210px;height:280px;position:relative;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.3,.7,.2,1)}
  .card{position:absolute;inset:0;background:var(--white);color:var(--ink);padding:.5rem .5rem .8rem;border-radius:8px;
    backface-visibility:hidden;display:flex;flex-direction:column;box-shadow:0 10px 30px rgba(0,0,0,.25)}
  .photo{flex:1;background:var(--pink);border-radius:4px;overflow:hidden}
  .card:nth-child(even) .photo{background:var(--mint)}
  .photo img{width:100%;height:100%;object-fit:cover;display:block}
  .card p{font-family:var(--display);font-weight:600;font-size:.95rem;line-height:1.25;margin:.6rem 0 0}
  .arrows{display:flex;justify-content:center;gap:1.5rem}
  .round{width:3.2rem;height:3.2rem;padding:0;font-size:1.6rem;line-height:1}

  .end{display:flex;flex-direction:column;align-items:center;gap:1.2rem}
  .end p{font-size:1.7rem;margin:0 0 1rem;max-width:20ch}

  nav{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;align-items:center;justify-content:space-between;
    padding:1.5rem 1.5rem 1.2rem;background:linear-gradient(transparent,rgba(156,10,29,.95) 45%)}
  .dots{display:flex;gap:.5rem}
  .dots span{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.35);transition:background .3s,transform .3s}
  .dots span.on{background:var(--lemon);transform:scale(1.35)}
  .heart{position:fixed;bottom:-3rem;color:#fff;opacity:.18;pointer-events:none;animation:floatUp linear infinite}
  @keyframes floatUp{to{transform:translateY(-120vh) rotate(25deg)}}

  /* Cake making */
  .center.tight{gap:1.2rem}
  .bake{position:relative;width:240px;height:250px;perspective:800px}
  .cake{position:absolute;bottom:14px;left:20px;width:200px;height:200px;transform-style:preserve-3d;animation:sway 6s ease-in-out infinite alternate}
  @keyframes sway{from{transform:rotateY(-14deg)}to{transform:rotateY(14deg)}}
  .plate{position:absolute;left:-30px;bottom:-10px;width:260px;height:18px;border-radius:50%;background:#fff;box-shadow:0 8px 14px rgba(0,0,0,.3)}
  .layer,.fill{position:absolute;left:0;width:200px;transform:scaleY(0);transform-origin:bottom;transition:transform .7s cubic-bezier(.3,1.4,.4,1)}
  .layer{height:56px;background:#f3b95f;border-radius:12px 12px 6px 6px}
  .l1{bottom:0}
  .fill{bottom:56px;height:12px;background:var(--pink);transition-delay:.2s}
  .l2{bottom:68px;transition-delay:.35s}
  .s2 .layer,.s2 .fill{transform:scaleY(1)}
  .frost{position:absolute;left:-6px;bottom:112px;width:212px;height:30px;border-radius:16px;background:#fff5f7;transform:scale(0);transform-origin:bottom;transition:transform .6s cubic-bezier(.3,1.4,.4,1)}
  .frost::after{content:"";position:absolute;left:0;right:0;top:80%;height:22px;background:radial-gradient(circle at 20px 0,#fff5f7 12px,transparent 13px) 0 0/40px 22px repeat-x}
  .s3 .frost{transform:scale(1)}
  .sprinkles{position:absolute;inset:0;opacity:0;transition:opacity .5s}
  .s4 .sprinkles{opacity:1}
  .sprinkles i{position:absolute;width:8px;height:3px;border-radius:2px}
  .candles i{position:absolute;bottom:138px;width:10px;height:38px;border-radius:3px;opacity:0;transform:translateY(-24px);transition:opacity .4s,transform .5s;
    background:repeating-linear-gradient(45deg,#fff 0 6px,var(--pink) 6px 12px)}
  .candles i:nth-child(1){left:45px}.candles i:nth-child(2){left:95px}.candles i:nth-child(3){left:145px}
  .s5 .candles i{opacity:1;transform:none}
  .candles b{position:absolute;left:50%;top:-18px;width:10px;height:16px;margin-left:-5px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;
    background:radial-gradient(circle at 50% 70%,#fff6c2,#ffb62e 60%,#ff7a1a);transform:scale(0);transform-origin:bottom;transition:transform .3s}
  .s6 .candles b{transform:scale(1);animation:flicker .35s ease-in-out infinite alternate}
  @keyframes flicker{to{transform:scale(1.15,.9) rotate(4deg)}}
  .tools{position:absolute;inset:0;transition:transform .8s,opacity .8s}
  .s2 .tools{opacity:0;transform:translateY(50px);pointer-events:none}
  .bowl{position:absolute;left:35px;bottom:20px;width:170px;height:90px;background:#fff;border-radius:0 0 90px 90px/0 0 80px 80px;overflow:hidden}
  .batter{position:absolute;left:8px;right:8px;top:8px;height:26px;border-radius:50%;background:repeating-linear-gradient(90deg,#f2c25b 0 18px,#fbe7ac 18px 36px)}
  .s1 .batter{animation:stir 1s linear infinite}
  @keyframes stir{to{background-position:36px 0}}
  .spoon{position:absolute;left:118px;bottom:70px;width:9px;height:110px;border-radius:5px;background:#c98a4b;transform-origin:bottom;transform:rotate(-14deg)}
  .s1 .spoon{animation:swish .5s ease-in-out infinite alternate}
  @keyframes swish{from{transform:rotate(-20deg)}to{transform:rotate(14deg)}}
  .say{font-size:1.35rem;margin:0;min-height:3.3em;max-width:18rem}

  #confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:10}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}.heart{display:none}}
</style>
</head>
<body>

<!-- ✏️ EDIT EVERYTHING HERE ✏️ -->
<script>
const CONFIG = {
  name: "Name",
  gateLine: "I made you something.",
  message: [
    "Fair warning: I made you a website. I regret nothing.",
    "No pressure, no big speech. I just wanted your birthday to have one more nice thing in it, and you’re someone I like making nice things for.",
    "Hope today is ridiculous in the best way."
  ],
  reasons: [
    "You laugh at your own jokes before the punchline, and it somehow makes them better.",
    "You text back like you actually want to.",
    "Plans with you turn into the best part of my week.",
    "You’re easy to be around, and I don’t say that about many people.",
    "You look good in literally everything. Just saying.",
    "Add an inside joke here."
  ],
  // Put your photos in a folder called "photos" next to this file.
  photos: [
    { src: "photos/1.jpg", caption: "The night that started it all" },
    { src: "photos/2.jpg", caption: "Your best (worst) pose" },
    { src: "photos/3.jpg", caption: "A caption only we get" },
    { src: "photos/4.jpg", caption: "Another one I love" }
  ],
  signoff: "Okay, go eat cake. Tell me about it later."
};
</script>

<div id="hearts" aria-hidden="true"></div>

<div class="stage" id="stage">
  <section class="page active">
    <div class="center">
      <h1 id="gateTitle"></h1>
      <button class="scene" id="gift" aria-label="Open the gift">
        <span class="cube" id="cube">
          <i class="face f1"></i><i class="face f2"></i><i class="face f3"></i>
          <i class="face f4"></i><i class="face f5"></i><i class="face f6"></i>
        </span>
      </button>
      <p class="hint">Tap the box</p>
    </div>
  </section>

  <section class="page future">
    <div class="wrap">
      <h2 class="hb" id="hb"></h2>
      <div class="msg" id="msg"></div>
    </div>
  </section>

  <section class="page future">
    <div class="wrap">
      <h3>Reasons I’m glad you exist</h3>
      <ul class="reasons" id="reasons"></ul>
    </div>
  </section>

  <section class="page future">
    <div class="wrap"><h3>Some evidence</h3></div>
    <div class="ring-wrap"><div class="ring" id="ring"></div></div>
    <div class="arrows">
      <button class="round" id="prev" aria-label="Previous photo">‹</button>
      <button class="round" id="nxt" aria-label="Next photo">›</button>
    </div>
  </section>

  <section class="page future">
    <div class="center tight">
      <h3 style="margin:0">Your cake, made from scratch</h3>
      <div class="bake" id="bake">
        <div class="tools"><div class="bowl"><div class="batter"></div></div><div class="spoon"></div></div>
        <div class="cake">
          <div class="plate"></div>
          <div class="layer l1"></div><div class="fill"></div><div class="layer l2"></div>
          <div class="frost"></div>
          <div class="sprinkles" id="sprinkles"></div>
          <div class="candles"><i><b></b></i><i><b></b></i><i><b></b></i></div>
        </div>
      </div>
      <p class="say" id="cakeStep"></p>
      <button id="cakeBtn"></button>
    </div>
  </section>

  <section class="page future">
    <div class="center end">
      <h2 class="hb">Happy birthday.</h2>
      <p id="signoff"></p>
      <button id="again">Throw more confetti</button>
      <button class="ghost small" id="replay">Replay from the start</button>
    </div>
  </section>
</div>

<nav id="nav" hidden>
  <button class="ghost small" id="back">Back</button>
  <div class="dots" id="dots"></div>
  <button class="small" id="next">Next</button>
</nav>

<canvas id="confetti" aria-hidden="true"></canvas>

<script>
const $ = id => document.getElementById(id);
const el = (tag, text) => { const e = document.createElement(tag); if (text) e.textContent = text; return e; };
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

// Fill in content
document.title = "Happy birthday, " + CONFIG.name;
$("gateTitle").textContent = "Hey " + CONFIG.name + ". " + CONFIG.gateLine;
$("hb").textContent = "Happy birthday, " + CONFIG.name + ".";
CONFIG.message.forEach((t, i) => { const p = el("p", t); p.style.setProperty("--i", i); $("msg").appendChild(p); });
CONFIG.reasons.forEach((t, i) => { const li = el("li", t); li.style.setProperty("--i", i); $("reasons").appendChild(li); });
$("signoff").textContent = CONFIG.signoff;

// 3D photo ring
const n = CONFIG.photos.length, step = 360 / n;
const radius = n > 2 ? Math.round(110 / Math.tan(Math.PI / n)) + 30 : 150;
let idx = 0;
CONFIG.photos.forEach((p, i) => {
  const card = el("div"), box = el("div"), img = el("img");
  card.className = "card"; box.className = "photo";
  card.style.transform = "rotateY(" + i * step + "deg) translateZ(" + radius + "px)";
  img.src = p.src; img.alt = p.caption; img.onerror = () => img.remove();
  box.appendChild(img); card.appendChild(box); card.appendChild(el("p", p.caption));
  $("ring").appendChild(card);
});
function spin(d){ idx += d; $("ring").style.transform = "translateZ(" + -radius + "px) rotateY(" + -idx * step + "deg)"; }
spin(0);
$("prev").onclick = () => spin(-1);
$("nxt").onclick = () => spin(1);
let sx = 0;
$("ring").parentElement.addEventListener("touchstart", e => sx = e.touches[0].clientX, { passive: true });
$("ring").parentElement.addEventListener("touchend", e => {
  const dx = e.changedTouches[0].clientX - sx;
  if (Math.abs(dx) > 40) spin(dx < 0 ? 1 : -1);
});

// Page flow
const pages = [...document.querySelectorAll(".page")];
let cur = 0;
for (let i = 1; i < pages.length; i++) $("dots").appendChild(document.createElement("span"));
function go(k){
  cur = Math.max(0, Math.min(pages.length - 1, k));
  pages.forEach((p, i) => {
    p.classList.toggle("active", i === cur);
    p.classList.toggle("past", i < cur);
    p.classList.toggle("future", i > cur);
    if (i === cur) p.scrollTop = 0;
  });
  $("nav").hidden = cur === 0;
  $("back").style.visibility = cur <= 1 ? "hidden" : "visible";
  $("next").style.visibility = cur === pages.length - 1 ? "hidden" : "visible";
  [...$("dots").children].forEach((d, i) => d.classList.toggle("on", i + 1 === cur));
  if (cur === pages.length - 1) setTimeout(confetti, 500);
}
$("next").onclick = () => go(cur + 1);
$("back").onclick = () => go(cur - 1);
addEventListener("keydown", e => {
  if (cur === 0) return;
  if (e.key === "ArrowRight") go(cur + 1);
  if (e.key === "ArrowLeft") go(cur - 1);
});
$("gift").onclick = () => {
  if ($("cube").classList.contains("open")) return;
  $("cube").classList.add("open");
  confetti();
  setTimeout(() => go(1), reduce ? 100 : 1100);
};
$("replay").onclick = () => { $("cube").classList.remove("open"); bk = 0; renderBake(); go(0); };
$("again").onclick = confetti;

// Cake making
const BAKE = [
  { say: "Let’s make you a cake. Ingredients are ready.", btn: "Mix the batter" },
  { say: "Stirring… this is the hard part.", btn: "Bake it" },
  { say: "Two golden layers, fresh out of the oven.", btn: "Add frosting" },
  { say: "A thick layer of frosting. No notes.", btn: "Add sprinkles" },
  { say: "Sprinkles, because you deserve them.", btn: "Add candles" },
  { say: "Candles are in.", btn: "Light them" },
  { say: "Make a wish. I won’t ask what it is.", btn: "Wish made" }
];
let bk = 0;
function renderBake(){
  $("bake").className = "bake " + Array.from({ length: bk }, (_, i) => "s" + (i + 1)).join(" ");
  $("cakeStep").textContent = BAKE[bk].say;
  $("cakeBtn").textContent = BAKE[bk].btn;
}
$("cakeBtn").onclick = () => {
  if (bk < BAKE.length - 1){ bk++; renderBake(); if (bk === BAKE.length - 1) confetti(); }
  else go(cur + 1);
};
["#ffe45c", "#7cffc4", "#ff4f6d", "#7aa2ff"].forEach((c, k) => {
  for (let i = 0; i < 5; i++){
    const sp = document.createElement("i");
    sp.style.cssText = "left:" + (10 + Math.random() * 180) + "px;bottom:" + (118 + Math.random() * 16) + "px;background:" + c + ";transform:rotate(" + Math.random() * 180 + "deg)";
    $("sprinkles").appendChild(sp);
  }
});
renderBake();

// Floating hearts
for (let i = 0; i < 14; i++){
  const h = el("span", "♥"); h.className = "heart";
  h.style.cssText = "left:" + Math.random() * 100 + "%;font-size:" + (1 + Math.random() * 2) + "rem;animation-duration:" + (14 + Math.random() * 14) + "s;animation-delay:-" + Math.random() * 20 + "s";
  $("hearts").appendChild(h);
}

// Confetti
const cv = $("confetti"), ctx = cv.getContext("2d");
const colors = ["#ffe45c", "#ff9ec4", "#7cffc4", "#ffffff"];
let parts = [], running = false;
function size(){ cv.width = innerWidth; cv.height = innerHeight; }
addEventListener("resize", size); size();
function confetti(){
  if (reduce) return;
  for (let i = 0; i < 180; i++) parts.push({
    x: cv.width / 2, y: cv.height * 0.55,
    vx: (Math.random() - 0.5) * 16, vy: -Math.random() * 18 - 6,
    w: 6 + Math.random() * 6, h: 10 + Math.random() * 8,
    r: Math.random() * 6, vr: (Math.random() - 0.5) * 0.4,
    c: colors[(Math.random() * colors.length) | 0]
  });
  if (!running){ running = true; requestAnimationFrame(tick); }
}
function tick(){
  ctx.clearRect(0, 0, cv.width, cv.height);
  parts.forEach(p => {
    p.vy += 0.35; p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);
    ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore();
  });
  parts = parts.filter(p => p.y < cv.height + 40);
  if (parts.length) requestAnimationFrame(tick);
  else { running = false; ctx.clearRect(0, 0, cv.width, cv.height); }
}
go(0);
</script>
</body>
</html>
